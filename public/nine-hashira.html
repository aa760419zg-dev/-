<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九柱修練錄 · 今天也一起變強</title>
<style>
:root{
  --sky1:#07111c; --sky2:#0f2233; --sky3:#1a3446;
  --glass:rgba(200,230,240,.06); --glass2:rgba(200,230,240,.1); --edge:rgba(119,166,245,.16);
  --qing:#9bd6b8; --qing-d:#548e70; --gold:#dec9a1; --gold-d:#9b835d;
  --text:#eef5f7; --mute:#a7bcc4; --dim:#6e8892; --red:#f0a08a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable;background:var(--sky1)}
body{color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%) fixed}
.wk{font-family:system-ui,"Noto Serif TC",serif}

/* ---------- 系統背景 ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.moon{position:absolute;top:-120px;right:-110px;width:300px;height:300px;opacity:.75;border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,230,.55) 0%,rgba(222,201,161,.18) 22%,rgba(155,214,184,.06) 45%,transparent 70%)}
.moon::after{content:"";position:absolute;top:96px;left:96px;width:108px;height:108px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fffbec,#f3e3b6 60%,#d9c48d);opacity:.4;filter:blur(.5px)}
.mist{position:absolute;width:160vw;height:220px;left:-30vw;border-radius:50%;filter:blur(40px);opacity:.5;
  background:radial-gradient(ellipse at center,rgba(220,240,245,.18),transparent 65%)}
.m1{top:18%;animation:drift 38s ease-in-out infinite alternate}
.m2{top:46%;animation:drift 52s ease-in-out infinite alternate-reverse;opacity:.35}
.m3{bottom:6%;height:280px;animation:drift 44s ease-in-out infinite alternate;opacity:.6}
@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(12vw)}}
.mtn{position:absolute;bottom:0;left:0;width:100%;height:38vh;min-height:220px}
#spirit{position:absolute;inset:0;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.mist{animation:none}}

/* ---------- 版面 ---------- */
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:22px 18px 104px;position:relative;z-index:1}
h1{font-family:system-ui,serif;font-weight:700;font-size:38px;letter-spacing:.12em;line-height:1.35;
  text-shadow:0 0 24px rgba(155,214,184,.35)}
h2{font-family:system-ui,serif;font-weight:700;font-size:24px;line-height:1.5;letter-spacing:.05em}
h3{font-family:system-ui,serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.3em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:1px;background:var(--gold-d)}
p{line-height:1.85;color:var(--mute);font-size:14.5px}
.tag{display:inline-block;font-family:system-ui,serif;font-size:13px;letter-spacing:.4em;color:var(--qing);padding:4px 4px 4px 14px;
  border-left:1px solid var(--qing-d);border-right:1px solid var(--qing-d)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-family:system-ui,serif;font-size:18px;font-weight:700;letter-spacing:.3em;cursor:pointer;
  color:#1e2a22;background:linear-gradient(90deg,#c9f2e8,#f6e3a6 55%,#c9f2e8);background-size:200% 100%;
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 30px rgba(155,214,184,.25),0 0 40px rgba(222,201,161,.15);
  animation:sheen 6s linear infinite;transition:transform .1s,opacity .2s}
@keyframes sheen{to{background-position:-200% 0}}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.28;box-shadow:none;cursor:default;animation:none}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--edge);box-shadow:none;font-weight:400;letter-spacing:.15em;font-size:15px;animation:none}
.card{background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--edge);border-radius:20px;padding:18px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sec{margin-top:22px}
.quote{font-family:system-ui,serif;text-align:center;color:var(--gold);opacity:.85;letter-spacing:.25em;font-size:14px;margin:26px 0 6px}

/* intro */
.intro{display:flex;flex-direction:column;min-height:calc(100vh - 130px);justify-content:center;gap:20px}
.seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:system-ui,serif;font-weight:700;font-size:36px;color:var(--gold);
  border:1px solid var(--gold-d);background:radial-gradient(circle,rgba(222,201,161,.14),transparent 70%);box-shadow:0 0 40px rgba(222,201,161,.2);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 70px rgba(222,201,161,.35);transform:translateY(-4px)}}
input.name{width:100%;background:rgba(7,17,28,.5);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;color:var(--text);font-family:system-ui,serif;font-size:17px;letter-spacing:.1em}
input.name:focus{outline:none;border-color:var(--qing-d);box-shadow:0 0 20px rgba(155,214,184,.15)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;height:38px}
.back{background:none;border:1px solid var(--edge);color:var(--mute);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.xpchip{font-family:system-ui,serif;font-size:14px;color:var(--gold);letter-spacing:.1em}
.stages{display:flex;gap:4px;margin:16px 0 0;height:44px}
.stages div{flex:1;text-align:center;font-family:system-ui,serif;font-size:13px;color:var(--dim);letter-spacing:.1em;transition:color .3s}
.stages i{display:block;width:9px;height:9px;margin:0 auto 7px;transform:rotate(45deg);border:1px solid var(--dim);transition:all .3s}
.stages .on{color:var(--qing)} .stages .on i{background:var(--qing);border-color:var(--qing);box-shadow:0 0 12px var(--qing)}
.stages .done{color:var(--mute)} .stages .done i{background:var(--qing-d);border-color:var(--qing-d)}
#qa{transition:opacity .18s ease;min-height:600px}
#qa.out{opacity:0}
.qtitle{margin:22px 0 4px;min-height:72px}
.qhint{font-size:13px;color:var(--dim);margin-bottom:18px;height:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:rgba(200,230,240,.05);border:1px solid var(--edge);border-radius:14px;padding:13px 16px;color:var(--text);
  font:inherit;font-size:15px;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s,opacity .2s;display:flex;align-items:baseline;gap:10px;-webkit-tap-highlight-color:transparent}
.opt .xn{font-family:system-ui,serif;font-size:17px;letter-spacing:.06em}
.opt .mn{font-size:12.5px;color:var(--dim);margin-left:auto;text-align:right}
.opt:hover{border-color:rgba(119,166,245,.3)}
.opt.sel{border-color:var(--qing);background:rgba(155,214,184,.13);box-shadow:0 0 22px rgba(155,214,184,.15) inset}
.opt.sel .mn{color:var(--qing)}
.opt.dis{opacity:.35}
.slider{margin:26px 0 10px;text-align:center}
.slider .val{font-family:system-ui,serif;font-size:68px;font-weight:700;color:var(--qing);line-height:1;text-shadow:0 0 30px rgba(155,214,184,.4)}
.slider .vl{font-family:system-ui,serif;color:var(--mute);margin-top:8px;height:22px;letter-spacing:.1em}
input[type=range]{width:100%;margin-top:22px;accent-color:var(--qing)}
.rlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:6px}
.foot{margin-top:24px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(4,10,16,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .3s both}
.ovbox{max-width:360px;width:100%;text-align:center;animation:rise .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.bigxp{font-family:system-ui,serif;font-size:54px;font-weight:700;color:var(--gold);margin:6px 0;text-shadow:0 0 30px rgba(222,201,161,.5)}
.flash{position:fixed;inset:0;background:#e9fbff;z-index:49;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:.85}16%{opacity:.1}24%{opacity:.6}100%{opacity:0}}
.bolt{width:70px;margin:0 auto;display:block;filter:drop-shadow(0 0 14px #bff4ff)}

/* scan */
.scan{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.stone{width:120px;height:120px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(155,214,184,.25) 40%,rgba(30,60,80,.5) 75%);
  box-shadow:0 0 60px rgba(155,214,184,.3),inset 0 0 30px rgba(255,255,255,.15);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 110px rgba(222,201,161,.45),inset 0 0 40px rgba(255,255,255,.3)}}
.scanlog{font-family:system-ui,serif;font-size:15px;color:var(--mute);height:24px;letter-spacing:.12em}

/* reveal / card */
.roots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.roots .card{padding:14px;text-align:center}
.roots .k{font-size:12px;color:var(--dim);letter-spacing:.2em}
.roots .v{font-family:system-ui,serif;font-size:26px;font-weight:700;margin:4px 0 2px}
.roots .s{font-size:12px;color:var(--mute)}
.who{display:flex;align-items:center;gap:14px}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:system-ui,serif;font-size:26px;font-weight:700;color:#1e2a22;
  background:radial-gradient(circle at 35% 30%,#fffbe8,var(--gold) 55%,var(--qing-d));box-shadow:0 0 26px rgba(222,201,161,.35)}
.rank{font-family:system-ui,serif;font-size:14px;color:var(--gold);letter-spacing:.15em}
.toggle{display:flex;background:rgba(7,17,28,.4);border:1px solid var(--edge);border-radius:999px;padding:4px;margin-bottom:6px}
.toggle button{flex:1;border:0;background:none;color:var(--mute);font-family:system-ui,serif;font-size:15px;padding:8px;border-radius:999px;cursor:pointer;letter-spacing:.1em}
.toggle button.on{background:rgba(155,214,184,.2);color:var(--qing)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.bars div{text-align:center;font-family:system-ui,serif;font-size:13px;color:var(--mute)}
.bars b{display:block;font-size:19px;color:var(--text);margin-bottom:2px}
.bars b.up{color:var(--qing)}
.heard div{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-top:1px solid var(--edge);padding:10px 0}
.heard div:first-child{border-top:0}
.heard span:first-child{color:var(--dim);flex-shrink:0;font-family:system-ui,serif;letter-spacing:.1em}
.heard span:last-child{text-align:right}

/* duration */
.durs{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.dur{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:14px 18px;border-radius:18px;border:1px solid var(--edge);background:rgba(200,230,240,.05);color:var(--text);cursor:pointer;font:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent}
.dur .d{font-family:system-ui,serif;font-size:32px;font-weight:700;width:58px;text-align:center;color:var(--qing);line-height:1}
.dur .d small{display:block;font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:.2em}
.dur .t{font-family:system-ui,serif;font-size:18px;letter-spacing:.1em}
.dur .x{font-size:12.5px;color:var(--dim);margin-top:2px}
.dur .rec{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid var(--gold-d);padding:2px 8px;border-radius:99px;flex-shrink:0;font-family:system-ui,serif;letter-spacing:.15em}
.dur.sel{border-color:var(--qing);background:rgba(155,214,184,.12);box-shadow:0 0 26px rgba(155,214,184,.12)}
.exitdate{text-align:center;margin-top:16px;height:54px}
.date{display:inline-block;font-family:system-ui,serif;font-weight:700;font-size:20px;color:var(--gold);border-top:1px solid var(--gold-d);border-bottom:1px solid var(--gold-d);padding:6px 18px;letter-spacing:.12em}

/* plan */
.d1{display:flex;flex-direction:column;gap:10px}
.d1 .card{display:flex;gap:14px;padding:14px}
.d1 .when{font-family:system-ui,serif;font-size:13px;color:var(--gold);letter-spacing:.2em;margin-bottom:2px}
.d1 .ic{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);font-family:system-ui,serif;font-size:17px;color:var(--qing)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-weight:400;font-size:12px;padding:6px 2px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 3px;border-top:1px solid var(--edge);text-align:center}
td .gf{font-family:system-ui,serif;font-size:15.5px;color:var(--text)}
td .pl{display:block;font-size:12px;color:var(--dim);margin-top:1px}
td.hi{color:var(--qing);font-weight:500}

/* today */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.dayhead .n{font-family:system-ui,serif;font-size:40px;font-weight:700;line-height:1.1;letter-spacing:.05em}
.dayhead .n small{font-size:16px;color:var(--mute)}
.xpbar{height:6px;background:rgba(7,17,28,.6);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--qing-d),var(--qing),var(--gold));box-shadow:0 0 12px var(--qing);transition:width .6s}
.xpmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--edge);background:rgba(200,230,240,.05);cursor:pointer;transition:all .25s;user-select:none;-webkit-tap-highlight-color:transparent}
.task .chk{width:30px;height:30px;border-radius:50%;border:1px solid var(--dim);display:grid;place-items:center;flex-shrink:0;transition:all .25s;font-family:system-ui,serif;font-size:15px;color:transparent}
.task.done{border-color:var(--qing-d);background:rgba(155,214,184,.1)}
.task.done .chk{background:var(--qing);border-color:var(--qing);color:#173029;box-shadow:0 0 16px var(--qing)}
.task .gf{font-family:system-ui,serif;font-size:17px;letter-spacing:.05em}
.task .tn{font-size:13px;color:var(--mute);margin-top:1px}
.task.done .gf{color:var(--qing)}
.task .tx{margin-left:auto;font-family:system-ui,serif;font-size:13px;color:var(--gold);flex-shrink:0}
.dots{display:grid;gap:5px;margin-top:10px}
.dots i{aspect-ratio:1;border-radius:50%;border:1px solid var(--edge);transition:all .3s}
.dots i.p{background:rgba(155,214,184,.35);border-color:var(--qing-d)}
.dots i.f{background:var(--qing);border-color:var(--qing);box-shadow:0 0 8px rgba(155,214,184,.6)}
.dots i.c{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.row2{display:flex;gap:10px;margin-top:14px}
.row2 .btn{font-size:14px;padding:11px}
.float{position:fixed;left:50%;top:32%;transform:translateX(-50%);font-family:system-ui,serif;font-size:30px;font-weight:700;color:var(--gold);pointer-events:none;
  text-shadow:0 0 20px rgba(222,201,161,.7);animation:up 1.1s ease forwards;z-index:60}
@keyframes up{to{opacity:0;transform:translate(-50%,-60px)}}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,17,28,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);z-index:40}
.nav div{max-width:440px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;color:var(--dim);font-family:system-ui,serif;font-size:12.5px;padding:10px 0 16px;cursor:pointer;letter-spacing:.15em}
.nav button b{display:block;font-size:21px;margin-bottom:1px;font-weight:700}
.nav button.on{color:var(--qing);text-shadow:0 0 12px rgba(155,214,184,.5)}
.reset{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:26px;display:block;width:100%}

/* Reality Quest inspired, unofficial life-quest concept. */
:root{--sky1:#080d1c;--sky2:#101a32;--sky3:#15182f;--glass:rgba(18,30,57,.8);--glass2:rgba(23,40,72,.9);--edge:rgba(119,166,245,.24);--qing:#9bd6b8;--qing-d:#548e70;--gold:#dec9a1;--gold-d:#9b835d;--text:#eff5ff;--mute:#b4c3de;--dim:#9babc7;--red:#ffb8a8}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 80% 0,rgba(100,76,209,.2),transparent 45%),linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3)) fixed}
.wk,h1,h2,h3,.tag,.btn,.seal,input.name,.xpchip,.stages div,.opt .xn,.slider .val,.slider .vl,.scanlog,.roots .v,.avatar,.rank,.toggle button,.bars div,.heard span:first-child,.dur .d,.dur .t,.dur .rec,.date,.d1 .when,.d1 .ic{font-family:inherit}
h1{font-size:36px;letter-spacing:-.04em;line-height:1.3;text-shadow:none}h2{font-size:24px;letter-spacing:-.025em}h3{font-size:14px;letter-spacing:.08em;color:var(--qing)}
p{line-height:1.8}.app{padding-top:26px;max-width:460px}.tag{font-size:12px;font-weight:700;letter-spacing:.16em;border:1px solid var(--qing-d);padding:6px 10px;border-radius:5px;background:rgba(56,133,230,.12)}
.intro{gap:22px}.seal{width:64px;height:64px;border-radius:16px;font-size:24px;letter-spacing:-.07em;color:var(--qing);border-color:var(--qing-d);background:rgba(67,124,217,.14);box-shadow:0 0 32px rgba(70,133,245,.15);animation:none}
.card{border-radius:14px;background:linear-gradient(145deg,var(--glass2),var(--glass));box-shadow:0 8px 30px rgba(0,0,0,.12)}
.btn{border-radius:10px;background:linear-gradient(100deg,#649fff,#aa8eff);color:#091127;letter-spacing:.1em;font-size:16px;animation:none;box-shadow:0 6px 22px rgba(96,118,255,.2);min-height:48px}
.btn.ghost{font-size:14px;letter-spacing:.03em;min-height:44px}.btn:focus-visible,.opt:focus-visible,.dur:focus-visible,.task:focus-visible{outline:2px solid var(--qing);outline-offset:3px}
input.name{font-size:16px;border-radius:10px;letter-spacing:.03em;background:rgba(8,15,32,.75)}.opt{border-radius:10px;min-height:52px}.opt.sel,.dur.sel{border-color:var(--qing);background:rgba(65,139,234,.15);box-shadow:inset 3px 0 var(--qing)}
.opt .xn{font-size:16px;letter-spacing:0}.opt .mn{font-size:12px}.stages{gap:6px}.stages div{font-size:12px;letter-spacing:0}.stages i{width:18px;height:3px;transform:none;border-radius:3px}.stages .on i{box-shadow:0 0 10px rgba(155,214,184,.4)}
.stone{border-radius:20px;transform:rotate(45deg);background:linear-gradient(140deg,rgba(155,214,184,.4),rgba(123,102,232,.16));border:1px solid var(--qing);box-shadow:0 0 55px rgba(103,146,255,.2)}
.moon{background:radial-gradient(circle,rgba(108,120,255,.18),transparent 65%)}.moon::after{display:none}.mist{opacity:.16;background:radial-gradient(ellipse,rgba(85,134,245,.2),transparent 65%)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(119,166,245,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(119,166,245,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(black,transparent 80%)}
.mtn{opacity:.6;height:32vh}.quote{font-family:inherit;font-size:13px;letter-spacing:.02em;color:var(--mute)}.roots .k{font-size:12px;letter-spacing:.12em}.roots .v{font-size:24px}.avatar{border-radius:14px;background:linear-gradient(135deg,#82c8ff,#dec9a1);color:#0b1730;box-shadow:none}
.toggle{border-radius:9px}.toggle button{border-radius:6px;font-size:13px;letter-spacing:0}.toggle button.on{background:rgba(103,161,255,.18)}.rank{letter-spacing:.02em}.d1 .ic{border-radius:9px;font-size:13px}.durs .dur{border-radius:12px}.dur .rec{font-size:12px;letter-spacing:0}.dur .x{font-size:13px}.dur .t{font-size:16px}.dur .d{font-size:30px}.date{font-size:18px;letter-spacing:.02em}

const clamp=(v,a=10,b=95)=>Math.max(a,Math.min(b,Math.round(v)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ========== 計算 ========== */
function ctx(){
  const a=S.a;
  return {focus:a.focus||[],block:a.block,act:a.act??1,limit:a.limit||[],place:a.place,stress:a.stress??5,screen:a.screen??1,
    sleep:a.sleep??2,bed:a.bed??0,diet:a.diet??1,water:a.water??1,talk:a.talk??1,dir:a.dir??1,push:a.push??1,conf:a.conf??5};
}
function scores(c){
  return {
    body:clamp([22,40,62,80][c.act]-(c.limit.filter(x=>x!=='none').length*5)),
    mind:clamp(98-c.stress*6+[12,4,-8,-16][c.screen]),
    rest:clamp([20,38,58,78][c.sleep]+[-12,-6,8,6][c.bed]),
    fuel:clamp([78,55,35,20][c.diet]+[-12,0,12][c.water]),
    bond:clamp([76,50,24][c.talk]),
    will:clamp([80,52,26][c.dir]),
  };
}
function buildPlan(){
  const c=ctx(), sc=scores(c);
  const count=c.conf<=3?3:c.conf<=7?4:5;
  const pri=PK.map(k=>({k,v:(100-sc[k])+(c.focus.includes(k)?30:0)})).sort((x,y)=>y.v-x.v);
  const sorted=PK.slice().sort((x,y)=>sc[x]-sc[y]);
  const weakest=sorted[0], strongest=sorted[sorted.length-1];
  let pillars=pri.slice(0,count).map(x=>x.k);
  if(!pillars.includes(weakest)) pillars[pillars.length-1]=weakest;
  const habits=pillars.map(k=>H.filter(h=>h.p===k&&h.ok(c)).sort((x,y)=>y.pref(c)-x.pref(c))[0].id);
  const avg=PK.reduce((s,k)=>s+sc[k],0)/6;
  const aptitude=avg<35?'初露鋒芒':avg<55?'穩步成長':avg<72?'根基紮實':'適性出眾';
  return {sc,weakest,strongest,habits,push:c.push,pillars,aptitude};
}
function projected(p,days){
  const f=Math.min(1,Math.pow(days/66,.7)), out={};
  PK.forEach(k=>{const gap=95-p.sc[k];out[k]=clamp(p.sc[k]+gap*(p.pillars.includes(k)?.62:.18)*f,10,96)});
  return out;
}
function target(h,week,push){
  if(h.fixed) return null;
  const w=Math.max(1,week);
  if(h.down) return Math.max(h.min,h.first(ctx())+h.step*Math.floor((w-1)/h.every));
  return Math.min(h.max,h.start[push]+h.step*Math.floor((w-1)/h.every));
}
function amount(h,week,push,day=null){
  let t=target(h,week,push);
  if(day&&day%7===0&&t!==null&&h.p==='body')t=Math.max(1,Math.round(t*.7));
  if(t===null) return h.n;
  if(h.down) return `${h.n} ≤ ${t} ${h.u}`;
  if(h.u==='毫升') return `${h.n} ${(t/1000).toFixed(1)} 公升`;
  return `${h.n} ${t} ${h.u}`;
}
function realmOf(xp){
  let i=0;for(let j=0;j<REALMS.length;j++) if(xp>=REALMS[j][0]) i=j;
  const cur=REALMS[i], nx=REALMS[i+1]||null;
  let stage='';
  if(nx&&i>0){const r=(xp-cur[0])/(nx[0]-cur[0]);stage=r<1/3?'修練 I':r<2/3?'修練 II':'修練 III'}
  return {name:cur[1],full:cur[1]+(stage?' · '+stage:''),cur,nx,i};
}
function dateAfter(days){const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`}
const quote=()=>QUOTES[Math.floor(Math.random()*QUOTES.length)];

/* ========== 雷達圖 ========== */
function radar(a,b,size=280){
  const cx=size/2,cy=size/2+4,R=size*.33;
  const pt=(i,v)=>{const g=-Math.PI/2+i*Math.PI/3;return [cx+Math.cos(g)*R*v/100,cy+Math.sin(g)*R*v/100]};
  const poly=vals=>PK.map((k,i)=>pt(i,vals[k]).join(',')).join(' ');
  let g=`<defs><radialGradient id="rf"><stop offset="0" stop-color="#dec9a1" stop-opacity=".35"/><stop offset="1" stop-color="#9bd6b8" stop-opacity=".18"/></radialGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
  [33,66,100].forEach(l=>{g+=`<polygon points="${PK.map((k,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="rgba(119,166,245,.14)"/>`});
  PK.forEach((k,i)=>{const [x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(119,166,245,.1)"/>`;
    const [lx,ly]=pt(i,125);g+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="15" fill="#b4c3de" font-family="system-ui,sans-serif">${P[k].n}</text>`});
  if(b) g+=`<polygon points="${poly(b)}" fill="none" stroke="#a7bcc4" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7"/>`;
  g+=`<polygon points="${poly(a)}" fill="none" stroke="#9bd6b8" stroke-width="5" opacity=".35" filter="url(#gl)"/>`;
  g+=`<polygon points="${poly(a)}" fill="url(#rf)" stroke="#9bd6b8" stroke-width="1.6"/>`;
  PK.forEach((k,i)=>{const [x,y]=pt(i,a[k]);g+=`<circle cx="${x}" cy="${y}" r="3" fill="#dec9a1"/>`});
  return `<svg viewBox="0 0 ${size} ${size+8}" width="100%" style="max-width:${size}px;display:block;margin:0 auto">${g}</svg>`;
}

function quiz(){
  if(!$('#quizShell')){
    app.innerHTML=`<div id="quizShell" class="fade">
      <div class="qtop"><button class="back" id="bk">‹</button><span class="xpchip" id="xpc"></span></div>
      <div class="stages" id="stg">${STAGES.map(n=>`<div><i></i>${n}</div>`).join('')}</div>

    </div>`;
    $('#bk').onclick=()=>{if(S.qi===0){go('intro')}else{S.qi--;swapQ()}};
    fillQ();
  }else swapQ();
}
function swapQ(){
  const qa=$('#qa'); qa.classList.add('out');
  setTimeout(()=>{fillQ();qa.classList.remove('out');save()},180);
}
function updateTop(){
  const q=Q[S.qi];
  $('#xpc').textContent=`修練值 ${S.xp}`;
  [...$('#stg').children].forEach((d,i)=>{d.className=i<q.s?'done':i===q.s?'on':''});
}
function fillQ(){
  const q=Q[S.qi], v=S.a[q.id];
  updateTop();
  let body='';
  if(q.type==='slider'){
    const cur=v??q.def; S.a[q.id]=cur;
    body=`<div class="slider"><div class="val" id="sv">${cur}</div><div class="vl" id="svl">${q.vl(cur)}</div>
      <input type="range" id="sr" min="${q.min}" max="${q.max}" value="${cur}">
      <div class="rlab"><span>${q.lo}</span><span>${q.hi}</span></div></div>`;
  }else{
    body=`<div class="opts">${q.o.map(([k,x,m],i)=>`<button class="opt" data-i="${i}"><span class="xn">${x}</span><span class="mn">${m}</span></button>`).join('')}</div>`;
  }
  const needBtn=q.type==='multi'||q.type==='slider';
  $('#qa').innerHTML=`<h2 class="qtitle">${q.q}</h2><div class="qhint">${q.hint||''}</div>${body}
    ${needBtn?`<div class="foot"><button class="btn" id="nx">繼 續</button></div>`:''}`;
  if(q.type==='slider'){
    $('#sr').oninput=e=>{const n=+e.target.value;S.a[q.id]=n;$('#sv').textContent=n;$('#svl').textContent=q.vl(n)};
  }else{
    markOpts();
    document.querySelectorAll('#qa .opt').forEach(b=>b.onclick=()=>pick(q.o[+b.dataset.i][0]));
  }
  if(needBtn) $('#nx').onclick=next;
}
function markOpts(){
  const q=Q[S.qi], v=S.a[q.id];
  const sel=q.type==='multi'?(v||[]):(v===undefined?[]:[v]);
  document.querySelectorAll('#qa .opt').forEach(b=>{
    const k=q.o[+b.dataset.i][0], on=sel.includes(k);
    b.classList.toggle('sel',on);
    b.classList.toggle('dis',q.type==='multi'&&!on&&sel.length>=q.max&&k!==q.none);
  });
  if(q.type==='multi') $('#nx').disabled=!(sel.length);
}
function pick(k){
  const q=Q[S.qi];
  if(q.type==='multi'){
    let arr=S.a[q.id]||[];
    if(k===q.none) arr=arr.includes(k)?[]:[k];
    else{arr=arr.filter(x=>x!==q.none);arr=arr.includes(k)?arr.filter(x=>x!==k):(arr.length<q.max?[...arr,k]:arr)}
    S.a[q.id]=arr; markOpts(); save();
  }else{
    S.a[q.id]=k; markOpts(); setTimeout(next,260);
  }
}
let advancing=false;
function next(){
  if(advancing) return; advancing=true; setTimeout(()=>advancing=false,400);
  const cur=Q[S.qi], nq=Q[S.qi+1];
  if(!nq){S.xp+=50;go('scan');return}
  S.qi++;
  if(nq.s!==cur.s) stageClear(STAGES[cur.s]); else swapQ();
}
function stageClear(name){

function hashSeed(text){let n=2166136261;for(const c of String(text))n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function taskPool(pillar,day){const c=ctx();let pool=H.filter(h=>h.p===pillar&&h.ok(c));if(day%7===0){const light=pool.filter(h=>h.light||['stretch','meditate','grat','phone','nobl','lights','water','veg','sugar','reach','listen','one'].includes(h.id));if(light.length)pool=light;}return pool}
function dailyTasks(day){
 if(!S.schedule)S.schedule={};
 if(S.schedule[day])return S.schedule[day].map(id=>H.find(h=>h.id===id)).filter(Boolean);
 // A pre-existing day keeps its original task identities and completion history.
 if((S.log[day]||[]).length){S.schedule[day]=S.plan.habits.slice();return dailyTasks(day)}
 const previous=day>1?dailyTasks(day-1):[];
 const tasks=S.plan.pillars.map(pillar=>{const guide=companionFor(day),pool=taskPool(pillar,day),last=previous.find(h=>h.p===pillar),candidates=pool.filter(h=>h.id!==last?.id),available=candidates.length?candidates:pool,preferred=available.filter(h=>guide.prefer.includes(h.id)),usable=day%3!==0&&preferred.length?preferred:available;const seed=hashSeed(S.name+':'+(S.runSeed||0)+':'+pillar+':'+guide.id);return usable[(seed+day-1)%usable.length]});
 S.schedule[day]=tasks.map(h=>h.id);return tasks;
}

function sideQuest(day){if(day%3!==0)return null;const i=(hashSeed(S.name+':'+(S.runSeed||0))+Math.floor(day/3)-1)%SIDEQUESTS.length;return SIDEQUESTS[i]}

    moti:['今夜','今晚把手機放到臥室外，開始你的入夜歸息任務。','02'],
    guide:['明日','上午 10 點前活動一次：適合時做 10 下深蹲，或快走 5 分鐘。','03'],
    quit:['今日','點亮修練紀錄的第一格。中斷也沒關係，回來繼續就好。','04'],
  };
  const items=[d1[c.block]||d1.guide,['今夜','把明天第一個任務寫在便條上，放在容易看到的地方。','05'],['本週','幫任務找一個開始的時機：刷牙後、回家後，就開始執行。','06']];
  app.innerHTML=`<div class="fade">
    ${companionBanner(S.day,true)}<span class="tag">修 練 手 帖</span>
    <h2 style="margin:14px 0 4px">${D} 日修練已安排。<br>每天，磨礪不同的自己。</h2>
    <p>依六維能力配置 ${hs.length} 項任務，包含優先提升的「${P[p.weakest].n}」。訓練任務會參考你填寫的限制；請依身體狀況調整，不適時停止。修練回顧日：<span style="color:var(--gold)">${dateAfter(D-1-(S.day-1))}</span></p>
    <div class="sec"><h3>育手的叮嚀</h3><div class="d1">
      ${items.map(([w,t,i])=>`<div class="card"><div class="ic">${i}</div><div><div class="when">${w}</div><div style="font-size:14px;line-height:1.7">${t}</div></div></div>`).join('')}
    </div></div>
    <div class="sec"><h3>本週修練手帖</h3><p class="plan-caption">不同任務輪流出現，第 7 天改為輕量恢復；每 3 天解鎖一個鎹鴉委託。已修畢的任務會保留。</p>${weekPreview()}</div><details class="card sec"><summary>鍛鍊份量參考 · 逐週調整</summary><p class="plan-caption">以下是各屬性的代表項目，實際每天會輪替不同任務。</p>
      <table><tr><th>任務</th>${cols.map(w=>`<th>第${w}週</th>`).join('')}</tr>
      ${hs.map(h=>`<tr><td><span class="gf">${h.f}</span><span class="pl">${h.n} · ${P[h.p].n}</span></td>${cols.map((w,i)=>{
        const t=target(h,w,p.push);
        const txt=t===null?'每日':(h.u==='毫升'?(t/1000).toFixed(1)+'L':(h.down?'≤'+t:t));
        return `<td class="${i===0?'hi':''}">${txt}</td>`}).join('')}</tr>`).join('')}
      </table>
      <p style="font-size:12px;margin-top:10px">單位：${[...new Set(hs.filter(h=>!h.fixed).map(h=>h.f+'＝'+(h.u==='毫升'?'公升':h.u)))].join('，')||'—'}</p>
      ${cols.length===1?'<p style="font-size:12px">7 日挑戰先維持任務量，建立穩定節奏。</p>':''}
    </details>
    <div class="quote">「把每一件小事，做成向前的力量。」</div>
    <p style="font-size:12.5px;text-align:center">這不是競速挑戰。任務量會逐週調整，累的時候也可以放慢。<br>能力預估僅為遊戲化示意，真實改變需要時間。</p>
    <div class="foot"><button class="btn" id="go">${S.started?'回 到 今 日 任 務':'接 受 今 日 任 務'}</button></div>
  </div>`;
  $('#go').onclick=()=>{S.started=true;go('today')};
}

/* ---------- 今日修練 ---------- */
function today(){
  const p=S.plan, D=S.dur, week=Math.ceil(S.day/7);
  const hs=dailyTasks(S.day);
  const theme=THEMES[(S.day-1)%7],side=sideQuest(S.day);
  const done=S.log[S.day]||[];
  const r=realmOf(S.xp);
  const pct=r.nx?((S.xp-r.cur[0])/(r.nx[0]-r.cur[0]))*100:100;
  let streak=0;for(let d=S.day-(done.length===hs.length?0:1);d>=1;d--){if((S.log[d]||[]).length===hs.length)streak++;else break}
  const colsN=D<=14?7:10;
  app.innerHTML=`<div class="fade">
    <div class="dayhead"><div><div class="rank">${esc(S.name)} · 第 ${week} 週</div><div class="n">修練第 ${S.day} 天<small> / ${D}</small></div></div>
      <div style="text-align:right"><div class="rank" style="font-size:12px">連續修練</div><div class="wk" style="font-size:28px;font-weight:700;color:var(--gold)">${streak} 日</div></div></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="wk" style="font-size:22px;font-weight:700;letter-spacing:.1em">${r.full}</span><span class="wk" style="font-size:14px;color:var(--gold)">修練值 ${S.xp}</span></div>
      <div class="xpbar"><i style="width:${pct}%"></i></div>
      <div class="xpmeta"><span>${r.nx?`距「${r.nx[1]}」尚差 ${r.nx[0]-S.xp} 修練值`:'已達本原型最高階級'}</span><span>每項 +10 · 全修 +30</span></div>
    </div>
    ${companionBanner()}
    <div class="daily-theme sec"><span class="tag">第 ${S.day} 日 · ${theme[0]}</span><p>${theme[1]}</p></div><div class="sec"><h3>今日修練 ${done.length} / ${hs.length}</h3><div class="tasks">
      ${hs.map(h=>{const on=done.includes(h.id);return `<div class="task ${on?'done':''}" data-id="${h.id}"><button class="task-main" data-complete="${h.id}" aria-pressed="${on}"><span class="chk">✓</span><span class="task-copy"><span class="gf">${h.f}</span><span class="tn">${amount(h,week,p.push,S.day)}</span><span class="task-attribute">${P[h.p].n} · +10 修練值</span></span></button>${on?'<span class="task-finished">已修畢</span>':`<button class="task-swap" data-swap="${h.p}" aria-label="替換${h.f}">換一項 ↻</button>`}</div>`}).join('')}
    </div></div>
    ${side?`<div class="card sec side-quest"><div class="preview-heading"><span class="tag">鎹鴉委託</span><span>+15 修練值</span></div><h2>${side[0]}</h2><p>${side[1]}</p><button class="btn ghost" id="side-complete">${S.sideLog?.[S.day]?'已修畢 · 取消記錄':'回 報 委 託 完 成'}</button><small>不影響每日修練全修與連續天數。</small></div>`:''}
    <details class="card sec"><summary>翻閱本週修練手帖</summary>${weekPreview()}</details>
    <div class="card sec"><h3>修練紀錄</h3>
      <div class="dots" style="grid-template-columns:repeat(${colsN},1fr)">${Array.from({length:D},(_,i)=>{const d=i+1,n=(S.log[d]||[]).length;
        return `<i class="${n===hs.length?'f':n>0?'p':''} ${d===S.day?'c':''}" title="第${d}日"></i>`}).join('')}</div>
      <div class="row2"><button class="btn ghost" id="prev" ${S.day<=1?'disabled':''}>‹ 前一日</button><button class="btn ghost" id="nxt" ${S.day>=D?'disabled':''}>下一日 ›</button></div>
      <p style="font-size:12px;text-align:center;margin-top:8px">原型示範：切到下一日，看看不同的任務。</p>
    </div>
    <div class="quote">「${quote()}」</div>
  </div>`;
  document.querySelectorAll('[data-complete]').forEach(t=>t.onclick=()=>toggleTask(t.dataset.complete,hs));
  document.querySelectorAll('[data-swap]').forEach(t=>t.onclick=()=>swapDailyTask(t.dataset.swap));
  if($('#side-complete'))$('#side-complete').onclick=toggleSideQuest;
  $('#prev').onclick=()=>{S.day--;render(true)};
  $('#nxt').onclick=()=>{S.day++;render(true)};
}
function toggleTask(id,hs){
  let arr=S.log[S.day]||[];
  const before=realmOf(S.xp).name;
  if(arr.includes(id)){if(arr.length===hs.length)S.xp-=30;arr=arr.filter(x=>x!==id);S.xp-=10}
  else{arr=[...arr,id];let gain=10;S.xp+=10;if(arr.length===hs.length){S.xp+=30;gain+=30}floatXP('+'+gain+' 修練值')}
  S.xp=Math.max(0,S.xp); S.log[S.day]=arr;
  const after=realmOf(S.xp).name;
  const y=window.scrollY; render(false); window.scrollTo(0,y);
  if(REALMS.findIndex(x=>x[1]===after)>REALMS.findIndex(x=>x[1]===before)) setTimeout(()=>tribulation(after),600);
  else if(S.day===S.dur&&arr.length===hs.length) setTimeout(exitRetreat,700);
}
function floatXP(t){const f=document.createElement('div');f.className='float';f.textContent=t;document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function tribulation(n){
  const fl=document.createElement('div');fl.className='flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),950);
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ovbox card">
    <svg class="bolt" viewBox="0 0 40 70"><path d="M24 2 L6 38 H19 L13 68 L34 28 H21 Z" fill="#e8fbff" stroke="#9bd6b8" stroke-width="1.5"/></svg>
    <span class="tag" style="margin-top:10px">階 級 晉 升</span><div class="bigxp" style="font-size:46px">${n}</div>
    <p>你的修練被看見了。一次又一次的堅持，讓階級向前邁進。收好這份鼓勵，下一段路也慢慢走。</p>
    <div class="foot"><button class="btn">繼 續 挑 戰</button></div></div>`;
  document.body.appendChild(ov); ov.querySelector('.btn').onclick=()=>{ov.remove();if(S.day===S.dur&&(S.log[S.day]||[]).length===dailyTasks(S.day).length)exitRetreat()};
}
function exitRetreat(){
  const full=Object.values(S.log).filter(a=>a.length===S.plan.habits.length).length;
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ovbox card"><span class="tag">修 練 告 一 段 落</span>
    <div class="bigxp" style="font-size:40px">修練回顧</div>
    <p>${S.dur} 日修練結束，其中 ${full} 天完成全部任務。<br>隊士階級：${realmOf(S.xp).full}</p>
    <div class="foot"><button class="btn" id="again">開 啟 下 輪 挑 戰</button><button class="btn ghost" id="stay" style="margin-top:10px">先留在這裡</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#stay').onclick=()=>ov.remove();
  ov.querySelector('#again').onclick=()=>{ov.remove();S.started=false;go('duration')};
}

/* ---------- 隊士檔案（角色卡） ---------- */
function card(){
  const p=S.plan, r=realmOf(S.xp), D=S.dur;
  const end=projected(p,D);
  const show=S.viewEnd?end:p.sc;
  app.innerHTML=`<div class="fade">
    <div class="who"><div class="avatar">${esc(S.name.slice(0,1))}</div>
      <div><div class="wk" style="font-size:22px;font-weight:700;letter-spacing:.08em">${esc(S.name)}</div><div class="rank">${r.full} · 修練值 ${S.xp}</div></div></div>
    <div class="roots">
      <div class="card"><div class="k">今 日 同 行</div><div class="v" style="color:var(--gold)">${companionFor().title}</div><div class="s">${P[p.strongest].n}優勢</div></div>
      <div class="card"><div class="k">待 提 升</div><div class="v" style="color:var(--red)">${P[p.weakest].n}</div><div class="s">${P[p.weakest].m}</div></div>
    </div>
    <div class="card sec">
      <div class="toggle"><button class="${!S.viewEnd?'on':''}" data-v="0">入隊之時</button><button class="${S.viewEnd?'on':''}" data-v="1">修練後（模擬）</button></div>
      <div id="rd">${radar(show,S.viewEnd?p.sc:null)}</div>
      <div class="bars">${PK.map(k=>`<div><b class="${S.viewEnd&&end[k]>p.sc[k]+8?'up':''}">${show[k]}</b>${P[k].n}</div>`).join('')}</div>
      <p style="font-size:12px;margin-top:10px;text-align:center">${S.viewEnd?`虛線為入隊之時。${D} 日後的模擬數值以任務類型估算，不代表實際健康變化。`:'切換查看修練後的模擬能力值'}</p>
    </div>
    ${companionBanner(S.day,true)}<div class="card sec"><h3>鬼殺隊階級之路</h3>
      ${REALMS.map(([x,n],i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;${i?'border-top:1px solid var(--edge);':''}font-family:system-ui,serif;font-size:16px;color:${S.xp>=x?(n===r.name?'var(--qing)':'var(--text)'):'var(--dim)'}"><span>${S.xp>=x?'◆':'◇'}　${n}</span><span style="font-size:13px">${x.toLocaleString()} 修練值</span></div>`).join('')}
    </div>
    <button class="reset" id="ch">更改修練天數</button>
    <button class="reset" id="rs" style="margin-top:10px">重新入隊評估（清除 修練值 與紀錄）</button>
  </div>`;
  document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{S.viewEnd=b.dataset.v==='1';const y=window.scrollY;render(false);window.scrollTo(0,y)});
  $('#ch').onclick=()=>go('duration');
  $('#rs').onclick=confirmReset;
}
function confirmReset(){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ovbox card"><h2>確定重新入隊評估？</h2><p style="margin:10px 0 18px">這份原型的回答、修練值 與修練紀錄都會清除。</p>
    <button class="btn" id="y">重 新 建 立</button><button class="btn ghost" id="n" style="margin-top:10px">再想想</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#n').onclick=()=>ov.remove();
  ov.querySelector('#y').onclick=()=>{ov.remove();S=fresh();try{localStorage.removeItem(KEY)}catch(e){};go('intro')};
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.addEventListener('click',e=>{if(e.target.closest('[data-open-pillars]')){if($('#nm')){S.name=$('#nm').value.trim();save()}openPillars()}});

/* ========== 數據光點 ========== */
(function(){
  const cv=$('#spirit'), cx=cv.getContext('2d');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,Hh,dots=[];
  function size(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;Hh=innerHeight;cv.width=W*d;cv.height=Hh*d;cx.setTransform(d,0,0,d,0,0)}
  function mk(y){return {x:Math.random()*W,y:y??Math.random()*Hh,r:Math.random()*1.8+.6,v:Math.random()*.25+.08,a:Math.random()*Math.PI*2,s:Math.random()*.6+.2,gold:Math.random()<.3}}
  size(); addEventListener('resize',size);
  dots=Array.from({length:46},()=>mk());
  function frame(){
    cx.clearRect(0,0,W,Hh);
    for(const d of dots){
      d.y-=d.v; d.a+=.01; const x=d.x+Math.sin(d.a)*14*d.s;
      if(d.y<-10){Object.assign(d,mk(Hh+10))}
      const al=.35+.35*Math.sin(d.a*2);
      const g=cx.createRadialGradient(x,d.y,0,x,d.y,d.r*6);
      const col=d.gold?'186,153,219':'106,181,155';
      g.addColorStop(0,`rgba(${col},${al})`);g.addColorStop(1,`rgba(${col},0)`);
      cx.fillStyle=g;cx.beginPath();cx.arc(x,d.y,d.r*6,0,Math.PI*2);cx.fill();
    }
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

/* ========== 啟動 ========== */
if(S.screen==='scan'){S.screen='quiz';S.qi=Q.length-1}
if(['plan','today','card','reveal','duration'].includes(S.screen)&&!S.plan){S.screen='intro'}
if(['plan','today'].includes(S.screen)&&!S.dur){S.screen='duration'}
render(true);
</script>
</body>
</html>
